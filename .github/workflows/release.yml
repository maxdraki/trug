name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write lets the release job create the GitHub Release for the tag.
  contents: write
  packages: write
  # SLSA build provenance: id-token mints the signing token, attestations
  # writes the provenance to GitHub's attestation store so a pulled image is
  # verifiably built from this tagged source.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and push multi-arch image to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        # GHCR rejects uppercase image names; github.repository preserves the
        # owner's case, so downcase it before using it in tags.
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check the image name matches what users actually pull
        # docker-compose.yml and install.sh hardcode one image name. Deriving
        # the published name from the repository instead means a release cut
        # from a fork or a staging clone publishes somewhere nobody is looking:
        # the workflow goes green, the release notes appear, and every
        # `docker compose pull` in the world keeps getting the old image. Fail
        # here instead, where it is one line to read.
        env:
          # Through env rather than inline ${{ }}: this one is derived from the
          # repository name and safe, but keeping every interpolation out of the
          # shell body is what stops the habit from meeting an untrusted value.
          REPO: ${{ steps.image.outputs.repo }}
        run: |
          published="ghcr.io/${REPO}"
          expected="$(sed -n 's|^ *image: \(ghcr.io/[^:]*\):.*|\1|p' docker-compose.yml | head -n 1)"
          if [ "$published" != "$expected" ]; then
            echo "::error::This release would publish $published, but docker-compose.yml"
            echo "::error::and install.sh point users at $expected. Nobody would receive it."
            echo "::error::Either release from the repository that owns $expected, or update"
            echo "::error::the image name in docker-compose.yml and install.sh to match."
            exit 1
          fi
          echo "Publishing $published, which is what users pull."

      - name: Check the in-app version matches the tag
        # Settings → About shows web/package.json's version, injected as
        # __APP_VERSION__ by Vite. Nothing bumps it automatically, so tagging
        # without editing it ships an image that reports the PREVIOUS release to
        # every user — which is exactly what v0.2.0 did: tagged 0.2.0, phone said
        # 0.1.5. The tag is the loud thing; the number people actually read is
        # this one, so they have to agree before anything is published.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag_version="${REF_NAME#v}"
          app_version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' web/package.json | head -n 1)"
          py_version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' server/pyproject.toml | head -n 1)"
          echo "tag=$tag_version  web=$app_version  server=$py_version"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $REF_NAME does not match web/package.json ($app_version)."
            echo "::error::Settings → About would show $app_version to everyone on $REF_NAME."
            echo "::error::Bump web/package.json (and server/pyproject.toml), commit, re-tag."
            exit 1
          fi
          if [ "$tag_version" != "$py_version" ]; then
            echo "::error::Tag $REF_NAME does not match server/pyproject.toml ($py_version)."
            exit 1
          fi

      - name: Compute image tags
        id: tags
        # Always publish the exact :vX.Y.Z tag. Only move :latest for a real
        # release — a prerelease tag (one with a hyphen, e.g. v0.2.0-rc1) must
        # never clobber the :latest that self-hosters pin.
        run: |
          repo="${{ steps.image.outputs.repo }}"
          ref="${{ github.ref_name }}"
          {
            echo "tags<<EOF"
            echo "ghcr.io/${repo}:${ref}"
            case "$ref" in
              *-*) : ;;                            # prerelease → no :latest
              *) echo "ghcr.io/${repo}:latest" ;;  # real release → move :latest
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build amd64 for smoke test (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: trug:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image before publishing
        # :latest is what self-hosters pull. Prove the container boots and
        # serves BEFORE anything reaches the registry — a failure here aborts
        # the release with nothing published, rather than shipping a broken
        # :latest that has to be chased down after the fact. The multi-arch
        # build below reuses these cached amd64 layers.
        run: |
          docker run -d --name trug-release -p 8000:8000 trug:smoke
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::release image never became healthy — not publishing"
              docker logs trug-release || true
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ | grep -q "<title>Trug</title>" \
            || { echo "::error::SPA not served — not publishing"; exit 1; }
          docker exec trug-release /app/.venv/bin/trug-doctor --json --redact \
            | python3 -c "import json,sys; json.load(sys.stdin)['status']" \
            || { echo "::error::trug-doctor broken — not publishing"; exit 1; }
          docker rm -f trug-release

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Tag convention: keep the full ref name including the leading "v".
          # A tag push of "v1.2.3" therefore publishes
          # ghcr.io/<owner>/<repo>:v1.2.3, plus :latest for non-prerelease tags
          # (see the "Compute image tags" step).
          tags: ${{ steps.tags.outputs.tags }}
          # Stamps org.opencontainers.image.revision/version into the image, so
          # `docker image inspect` answers "which commit is this?" without
          # anyone having to go digging in the filesystem.
          build-args: |
            GIT_REVISION=${{ github.sha }}
            GIT_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Attach in-toto SLSA provenance to the image manifest in the registry.
          provenance: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.image.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release
        # Publishes a Release for the pushed tag so the CHANGELOG's
        # releases/tag/vX.Y.Z link resolves instead of 404-ing. Notes are
        # auto-generated from the commits since the previous tag; a tag with a
        # hyphen (e.g. v0.2.0-rc1) is marked as a prerelease.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
