name: CI

on:
  push:
    # Every branch, no tags. A release tag points at a commit main has already
    # tested, so without this the whole suite runs twice on the identical SHA.
    # Note: this must be `branches`, not `tags-ignore` — a push filter that
    # names only tag criteria excludes branch pushes altogether, which silently
    # switches CI off.
    branches: ["**"]
  pull_request:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (ruff + pytest, no-key mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The test suite must pass with NO LLM_API_KEY set, proving the app's
    # no-key / offline mode works. We deliberately do not set that secret here.
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (with Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest, no LLM_API_KEY)
        env:
          # Explicitly blank so any LLM_API_KEY leaking from the environment
          # cannot make the suite pass under a different mode.
          LLM_API_KEY: ""
        run: uv run pytest

  web:
    name: web (vitest + svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 22 LTS. The repo was developed on Node 26, but the toolchain
      # (vite 8, vitest 4, svelte 5) supports Node 22+, so LTS is used here.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npx vitest run

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Build
        run: npm run build

  generated:
    name: generated artifacts up to date (icons + theme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # icons.ts (parsed from server/trug/icons.py + @tabler/icons) and theme.css
    # (from @catppuccin/palette) are committed generated artifacts. Regenerate
    # them and fail if the committed copies drifted — catches a forgotten
    # `gen-icons`/`gen-theme` after an icon-map edit or a Tabler/Catppuccin bump.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate theme + icons from source
        run: |
          npm run gen-theme
          npm run gen-icons

      - name: Fail if committed artifacts drifted
        run: |
          git diff --exit-code -- src/theme.css src/lib/icons.ts \
            || { echo "::error::src/theme.css or src/lib/icons.ts is stale — run 'npm run gen-theme && npm run gen-icons' in web/ and commit."; exit 1; }

  docker:
    name: docker image builds and boots
    runs-on: ubuntu-latest
    # `docker compose up` is the primary install path, but the image was
    # previously first built during release.yml — i.e. a broken Dockerfile
    # was only discovered by a self-hoster pulling :latest. Build it on every
    # change and prove the container actually serves.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64, loaded into the local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: trug:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and smoke-test it
        # No env is required: on first run trug generates its own tokens and
        # SQLite file. Asserts the three things a self-hoster needs on day one
        # — the API answers, the PWA is served, and the recovery CLI exists.
        run: |
          docker run -d --name trug-ci -p 8000:8000 trug:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then echo "::error::container never became healthy"; exit 1; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/ | grep -q "<title>Trug</title>" \
            || { echo "::error::SPA not served at /"; exit 1; }
          # trug-doctor exits non-zero on warnings (expected in a bare
          # container with no TRUG_ORIGIN), so assert it emits valid JSON
          # rather than a clean exit — this proves the console script shipped.
          docker exec trug-ci /app/.venv/bin/trug-doctor --json --redact \
            | python3 -c "import json,sys; json.load(sys.stdin)['status']" \
            || { echo "::error::trug-doctor missing or not emitting valid JSON"; exit 1; }

      - name: Boot again with a platform-injected PORT
        # Railway, Render, Fly and Heroku all inject PORT and aim their
        # healthcheck and public routing at it. Hardcoding 8000 made every
        # Railway template deploy fail with "service unavailable" while the app
        # sat happily on the wrong port — and the zero-env smoke test above
        # could never have caught it, because nothing there sets PORT.
        run: |
          set -e
          check() {
            name="$1"; port="$2"; shift 2
            docker run -d --name "$name" "$@" -p "$port:$port" trug:ci >/dev/null
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 && break
              if [ "$i" = 60 ]; then
                echo "::error::$name never served on port $port"
                docker logs "$name" || true
                exit 1
              fi
              sleep 1
            done
            # Assert the container's OWN verdict, not just host reachability:
            # orchestrators act on this, and a mismatch between how the
            # entrypoint and the HEALTHCHECK default PORT leaves curl passing
            # while the container reports itself unhealthy.
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = healthy ] && break
              if [ "$status" = unhealthy ] || [ "$i" = 30 ]; then
                echo "::error::$name serves on $port but its HEALTHCHECK reports $status"
                docker inspect -f '{{json .State.Health}}' "$name" || true
                exit 1
              fi
              sleep 2
            done
            echo "$name: serving on $port, HEALTHCHECK healthy"
            docker rm -f "$name" >/dev/null
          }

          docker rm -f trug-ci >/dev/null 2>&1 || true   # frees port 8000

          check trug-ci-port 9090 -e PORT=9090
          # Railway can inject an EMPTY value; the entrypoint and the
          # HEALTHCHECK must BOTH fall back to 8000, or the container lies.
          check trug-ci-empty 8000 -e PORT=

          # A non-numeric PORT must fail loudly rather than land on uvicorn's
          # argv — "8000 --log-level critical" would silence every log line.
          if docker run --rm -e PORT="8000 --log-level critical" trug:ci >/dev/null 2>&1; then
            echo "::error::a non-numeric PORT was accepted — argv injection is possible"
            exit 1
          fi
          echo "non-numeric PORT rejected"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs trug-ci || true; docker logs trug-ci-port || true; docker logs trug-ci-empty || true
