name: CI

on:
  push:
    # Every branch, no tags. A release tag points at a commit main has already
    # tested, so without this the whole suite runs twice on the identical SHA.
    # Note: this must be `branches`, not `tags-ignore` — a push filter that
    # names only tag criteria excludes branch pushes altogether, which silently
    # switches CI off.
    branches: ["**"]
  pull_request:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same branch/PR supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (ruff + pytest, no-key mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # The test suite must pass with NO LLM_API_KEY set, proving the app's
    # no-key / offline mode works. We deliberately do not set that secret here.
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv (with Python 3.12)
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest, no LLM_API_KEY)
        env:
          # Explicitly blank so any LLM_API_KEY leaking from the environment
          # cannot make the suite pass under a different mode.
          LLM_API_KEY: ""
        run: uv run pytest

  web:
    name: web (vitest + svelte-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Node 22 LTS. The repo was developed on Node 26, but the toolchain
      # (vite 8, vitest 4, svelte 5) supports Node 22+, so LTS is used here.
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npx vitest run

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Build
        run: npm run build

  generated:
    name: generated artifacts up to date (icons + theme)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    # icons.ts (parsed from server/trug/icons.py + @tabler/icons) and theme.css
    # (from @catppuccin/palette) are committed generated artifacts. Regenerate
    # them and fail if the committed copies drifted — catches a forgotten
    # `gen-icons`/`gen-theme` after an icon-map edit or a Tabler/Catppuccin bump.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate theme + icons from source
        run: |
          npm run gen-theme
          npm run gen-icons

      - name: Fail if committed artifacts drifted
        run: |
          git diff --exit-code -- src/theme.css src/lib/icons.ts \
            || { echo "::error::src/theme.css or src/lib/icons.ts is stale — run 'npm run gen-theme && npm run gen-icons' in web/ and commit."; exit 1; }

  docker:
    name: docker image builds and boots
    runs-on: ubuntu-latest
    # `docker compose up` is the primary install path, but the image was
    # previously first built during release.yml — i.e. a broken Dockerfile
    # was only discovered by a self-hoster pulling :latest. Build it on every
    # change and prove the container actually serves.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, loaded into the local daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: trug:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and smoke-test it
        # No env is required: on first run trug generates its own tokens and
        # SQLite file. Asserts the three things a self-hoster needs on day one
        # — the API answers, the PWA is served, and the recovery CLI exists.
        run: |
          docker run -d --name trug-ci -p 8000:8000 trug:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then echo "::error::container never became healthy"; exit 1; fi
            sleep 1
          done
          # Captured, not piped. Both of these were correct only because
          # GitHub's default shell omits `pipefail` — adding `shell: bash`
          # anywhere above, which looks like tidying, would break them:
          # `grep -q` SIGPIPEs curl once the page exceeds a pipe buffer, and
          # trug-doctor's exit 1 on warnings (expected here, and the reason this
          # asserts on the JSON rather than the status) would fail the step.
          body="$(curl -fsS http://localhost:8000/)"
          case "$body" in
            *"<title>Trug</title>"*) ;;
            *) echo "::error::SPA not served at /"; exit 1 ;;
          esac
          doctor_json="$(docker exec trug-ci /app/.venv/bin/trug-doctor --json --redact || true)"
          printf '%s' "$doctor_json" \
            | python3 -c "import json,sys; json.load(sys.stdin)['status']" \
            || { echo "::error::trug-doctor missing or not emitting valid JSON"; exit 1; }

      - name: Boot again with a platform-injected PORT
        # Railway, Render, Fly and Heroku all inject PORT and aim their
        # healthcheck and public routing at it. Hardcoding 8000 made every
        # Railway template deploy fail with "service unavailable" while the app
        # sat happily on the wrong port — and the zero-env smoke test above
        # could never have caught it, because nothing there sets PORT.
        run: |
          set -e
          check() {
            name="$1"; port="$2"; shift 2
            docker run -d --name "$name" "$@" -p "$port:$port" trug:ci >/dev/null
            for i in $(seq 1 60); do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 && break
              if [ "$i" = 60 ]; then
                echo "::error::$name never served on port $port"
                docker logs "$name" || true
                exit 1
              fi
              sleep 1
            done
            # Assert the container's OWN verdict, not just host reachability:
            # orchestrators act on this, and a mismatch between how the
            # entrypoint and the HEALTHCHECK default PORT leaves curl passing
            # while the container reports itself unhealthy.
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$name")
              [ "$status" = healthy ] && break
              if [ "$status" = unhealthy ] || [ "$i" = 30 ]; then
                echo "::error::$name serves on $port but its HEALTHCHECK reports $status"
                docker inspect -f '{{json .State.Health}}' "$name" || true
                exit 1
              fi
              sleep 2
            done
            echo "$name: serving on $port, HEALTHCHECK healthy"
            docker rm -f "$name" >/dev/null
          }

          docker rm -f trug-ci >/dev/null 2>&1 || true   # frees port 8000

          check trug-ci-port 9090 -e PORT=9090
          # Railway can inject an EMPTY value; the entrypoint and the
          # HEALTHCHECK must BOTH fall back to 8000, or the container lies.
          check trug-ci-empty 8000 -e PORT=

          # A non-numeric PORT must fail loudly rather than land on uvicorn's
          # argv — "8000 --log-level critical" would silence every log line.
          if docker run --rm -e PORT="8000 --log-level critical" trug:ci >/dev/null 2>&1; then
            echo "::error::a non-numeric PORT was accepted — argv injection is possible"
            exit 1
          fi
          echo "non-numeric PORT rejected"

      - name: Container logs (on failure)
        if: failure()
        run: docker logs trug-ci || true; docker logs trug-ci-port || true; docker logs trug-ci-empty || true

  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # install.sh and bin/trug are the first code a self-hoster runs, and neither
    # has a compiler or a type-checker to catch a typo'd variable. shellcheck is
    # that check; bats covers the behaviour that would otherwise only be found
    # by someone's broken Saturday.
    #
    # BOTH platforms, and this is the point of the job. These scripts are written
    # on a Mac (BSD userland) and run in production on Linux (GNU userland), and
    # for a while the only place each was exercised was one of those two — so
    # every divergence was structurally guaranteed to surface as a CI
    # round-trip. It cost three in one afternoon: `stat -f` vs `stat -c`, bats
    # 1.10 vs 1.14 on whether a bare `[[ ]]` fails a test, and shellcheck 0.10
    # vs 0.11 on SC2015. A macOS leg needs no Docker, since the suite stubs it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Lint (shellcheck)
        # install.sh is POSIX sh on purpose (a Pi's /bin/sh is dash), so it is
        # checked as `sh` rather than under shellcheck's bash default — which
        # would happily accept bashisms the installer must not contain.
        # bin/trug is bash, and its shebang says so.
        #
        # Pinned rather than taking the runner's: which checks fire varies by
        # version in both directions, so an unpinned lint is a check that can
        # start failing on a commit that changed nothing, and can pass locally
        # while failing here. Bump this deliberately.
        if: matrix.os == 'ubuntu-latest'
        env:
          SHELLCHECK_VERSION: v0.10.0
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJf - --strip-components=1 -C /usr/local/bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version
          shellcheck -s sh install.sh
          shellcheck bin/trug
          shellcheck -s bash tests/shell/helpers.bash

      - name: Install bats-core
        # Pinned, for the same reason shellcheck is. `apt-get install bats` is
        # 1.10 on ubuntu-24.04 and would jump when the runner image rolls;
        # Homebrew's is 1.14 today. Those two disagree about whether a failing
        # `[[ ]]` fails a test, which is exactly the kind of silent semantic
        # change that must not arrive without a commit.
        env:
          BATS_VERSION: v1.11.1
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          bats --version

      - name: Test (bats)
        run: bats tests/shell/

  install:
    name: install.sh end-to-end (real docker)
    runs-on: ubuntu-latest
    # The bats suite runs against a stubbed docker, so it can prove what the
    # installer *says* but never that the thing it installs works. This job runs
    # the actual one-liner against a real daemon: install, health, then the two
    # verbs a new self-hoster reaches for on day one.
    #
    # No macOS counterpart: GitHub's macOS runners ship no Docker daemon.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image this commit produces
        # Tagged trug:ci, NOT ghcr.io/maxdraki/trug:latest. The published tag
        # pulls successfully at any time, so naming the local build after it
        # would just have `docker compose pull` replace it with the last release
        # — and the job would then install and test that, passing whatever this
        # commit did.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: trug:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the installer
        # TRUG_IMAGE runs the image built above; TRUG_LOCAL_SRC takes bin/trug
        # from this checkout instead of raw.githubusercontent.com/main. Without
        # both, the job tests what is already released rather than the change in
        # front of it. The pull of trug:ci fails (nothing by that name in any
        # registry) and the installer falls back to the local copy, which
        # exercises the offline-repair path here for free.
        env:
          TRUG_LOCAL_SRC: ${{ github.workspace }}
          TRUG_IMAGE: trug:ci
        run: sh install.sh

      - name: It is running the image this commit built
        # Cheap, and it is the assertion that would have caught the bug above.
        run: |
          running="$(docker inspect --format '{{.Config.Image}}' trug)"
          [ "$running" = "trug:ci" ] \
            || { echo "::error::container is running $running, not the build under test"; exit 1; }

      - name: It installed what it promised
        run: |
          [ -d "$HOME/.trug" ] || { echo "::error::installer did not create ~/.trug"; exit 1; }
          [ -f "$HOME/.trug/.env" ] || { echo "::error::no ~/.trug/.env"; exit 1; }
          [ -f "$HOME/.trug/docker-compose.yml" ] || { echo "::error::no ~/.trug/docker-compose.yml"; exit 1; }
          [ -x "$HOME/.local/bin/trug" ] || { echo "::error::the trug command was not installed"; exit 1; }
          curl -fsS http://localhost:8000/healthz >/dev/null \
            || { echo "::error::installed trug does not answer on /healthz"; exit 1; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: trug status
        # trug-doctor's exit code passes through: 0 healthy, 1 warnings, 2 broken.
        # A fresh localhost install warns (no HTTPS origin, no LLM key), so only
        # 2 — or a crash — is a CI failure.
        run: |
          set +e
          trug status
          rc=$?
          set -e
          [ "$rc" -le 1 ] || { echo "::error::trug status reported a broken install (exit $rc)"; exit 1; }

      - name: trug share prints a joinable link
        run: |
          out="$(trug share)"
          printf '%s\n' "$out"
          case "$out" in
            *"?token="*) ;;
            *) echo "::error::trug share printed no ?token= URL"; exit 1 ;;
          esac
          # The link must carry the MCP token, never the one that creates the
          # first account.
          boot="$(sed -n 's/^TRUG_BOOTSTRAP_TOKEN=//p' "$HOME/.trug/.env" | head -n 1)"
          case "$out" in
            *"$boot"*) echo "::error::trug share leaked the bootstrap token"; exit 1 ;;
          esac

      - name: Container logs (on failure)
        if: failure()
        run: docker compose --project-directory "$HOME/.trug" logs || true
